name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CalculiX and the Gmsh runtime
        run: sudo apt-get update && sudo apt-get install -y calculix-ccx libglu1-mesa libgeos-dev
      - name: Install the geometry kernel and the constitutive model
        # not on PyPI yet: install them from their repositories
        run: |
          pip install "implicit-geometry-kernel @ git+https://github.com/samhughes-fea/implicit-geometry-kernel@v0.9.5"
          pip install "laminate-constitutive-model @ git+https://github.com/samhughes-fea/laminate-constitutive-model@v0.2.0"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Run benchmark
        run: shell-fem-benchmarks --n 6 --work-dir benchmark_runs

  core-install:
    # Builds the sdist and wheel and runs the wheel in a clean environment (this
    # used to run in release.yml on every pull request).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          sudo apt-get update && sudo apt-get install -y libgeos-dev
          python -m venv /tmp/wheel-env
          # the geometry kernel is not on PyPI yet: install it from its repository first
          /tmp/wheel-env/bin/pip install "implicit-geometry-kernel @ git+https://github.com/samhughes-fea/implicit-geometry-kernel@v0.9.5"
          /tmp/wheel-env/bin/pip install "laminate-constitutive-model @ git+https://github.com/samhughes-fea/laminate-constitutive-model@v0.2.0"
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/python -c "import shell_fem as sf; print(sf.__version__, len(sf.__all__), 'public names')"
          /tmp/wheel-env/bin/shell-fem-benchmarks --n 4 --work-dir /tmp/bench
