name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CalculiX and the Gmsh runtime
        run: sudo apt-get update && sudo apt-get install -y calculix-ccx libglu1-mesa libgeos-dev
      - name: Install the geometry kernel and the constitutive model
        # not on PyPI yet: install them from their repositories
        run: |
          pip install "implicit-geometry-kernel @ git+https://github.com/samhughes-fea/implicit-geometry-kernel@v0.9.2"
          pip install "laminate-constitutive-model @ git+https://github.com/samhughes-fea/laminate-constitutive-model@v0.2.0"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Run benchmark
        run: shell-fem-benchmarks --n 6 --work-dir benchmark_runs
