[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shell-fem"
dynamic = ["version"]
description = "Layered shell and solid finite elements for composite structures: CLPT/FSDT/zig-zag/layerwise shells, blade shell models, stress recovery, progressive damage and CalculiX/Nastran kernels."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sam Hughes" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.22", "laminate-constitutive-model>=0.2.0", "implicit-geometry-kernel>=0.9.2"]
keywords = [
    "composites", "laminate", "finite element", "FEA", "shell", "wind turbine blade",
    "classical laminate theory", "failure criteria", "CalculiX", "Nastran",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
sparse = ["scipy>=1.8"]
gmsh = ["gmsh>=4.11"]
examples = ["scipy>=1.8", "matplotlib>=3.5", "gmsh>=4.11"]
dev = ["scipy>=1.8", "pytest>=7", "gmsh>=4.11", "matplotlib>=3.5", "build>=1.0", "twine>=5"]

[project.urls]
Homepage = "https://github.com/samhughes-fea/shell-fem"
Source = "https://github.com/samhughes-fea/shell-fem"
Issues = "https://github.com/samhughes-fea/shell-fem/issues"
Changelog = "https://github.com/samhughes-fea/shell-fem/blob/main/CHANGELOG.md"

[project.scripts]
shell-fem-benchmarks = "shell_fem.run_solver_benchmarks:cli"

[tool.setuptools.dynamic]
version = { attr = "shell_fem.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
